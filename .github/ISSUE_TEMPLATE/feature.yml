name: Feature request
description: Suggest an improvement for couch-friendly Twitch viewing.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and who would benefit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Consider the six-key interface and Twitch's official player constraints.
    validations:
      required: true
