name: Bug report
description: Report a reproducible problem with VacuumStream.
body:
  - type: markdown
    attributes:
      value: Do not include access tokens, device codes, Client Secrets, or private logs. Report security issues through the Security tab instead.
  - type: input
    id: version
    attributes:
      label: Version and installation method
      placeholder: Release tag or commit; AppImage, Flatpak, or source
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Linux environment
      placeholder: Distribution, hardware, Wayland/X11, Desktop/Gaming Mode
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include whether you were signed in and which controller or keyboard inputs you used.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized logs
